<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Bill</title>
    <link rel="stylesheet" href="./pps.css">
</head>
<body>

    <div class="outer">
        <div class="inner">
            <h3>Product Price Calculator ⭐</h3>
            <div class="pro">
                <img src="https://m.media-amazon.com/images/I/61zwK7mmLtL.jpg" alt="" height="80" width="80">
                <div class="details">
                    <h4>iPhone</h4>
                    <p>1,35,000</p>
                </div>
                <input type="number" min="0" placeholder="0" class="in">
            </div>
           
            <div class="pro">
                <img src="https://in.canon/media/image/2024/07/17/3d47abeaf9574a9ba9401c6ff2ca7bb1_EOS+R5+Mark+II+%26+RF24-105mm+f4L+IS+USM+Front+Slant.png" alt="" height="80" width="80">
               <div class="details">
                <h4>Camera</h4>
                <p>45,000</p>
               </div>
                <input type="number" min="0" placeholder="0" class="in">
                
            </div>
           
            <div class="pro">
                <img src="https://p2-ofp.static.pub//fes/cms/2024/07/17/109vq5fdalv01w5jsu6vh35ncnk5jn890135.png" alt="" height="80" width="80">
               <div class="details">
                <h4>Laptop</h4>
                <p>70,000</p>
               </div>
                <input type="number" min="0" placeholder="0" class="in">

            </div>
            
            <div class="btn">
                <button id="cal">Calculate</button>
                <button id="ref">Refresh</button>
            </div>
    
</div>
<div class="total">
    <h1>Total: <span id="tot"></span></h1>
    <div class="receipt">
        <h2>Receipt</h2>
        <div id="receiptBox"></div>
    </div>


    <script src="./pps.js"></script>
</body>
</html>
